name: Quant Pipeline CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Smoke test feature pipeline & syntax
      run: |
        python -c "import config, data_loader, feature_engineering, model_pipeline, evaluate, backtester, visualizer; print('All quant modules import successfully')"
